stages:
  - build
  - release

variables:
  GO_VERSION: "1.23"
  API_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"

.wails_base:
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.0-dev curl ca-certificates gnupg
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - cd frontend && npm install && cd ..
    - go install github.com/wailsapp/wails/v2/cmd/wails@latest
    - export PATH="$PATH:$HOME/go/bin"
  rules:
    - if: '$CI_COMMIT_TAG'

build-linux-amd64:
  extends: .wails_base
  stage: build
  script:
    - wails build -platform linux/amd64
  artifacts:
    paths:
      - build/bin/portdesk
      - build/bin/portdesk.deb
    expire_in: 30 days

build-windows-amd64:
  extends: .wails_base
  stage: build
  script:
    - apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
    - wails build -platform windows/amd64
  artifacts:
    paths:
      - build/bin/portdesk.exe
    expire_in: 30 days

create-release:
  stage: release
  image: alpine:latest
  dependencies:
    - build-linux-amd64
    - build-windows-amd64
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - apk add --no-cache curl jq
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - git fetch --tags --unshallow 2>/dev/null || git fetch --tags 2>/dev/null || true
  script:
    - mkdir -p release
    - cp -r build/bin/* release/ 2>/dev/null || true
    - "RELEASE_DESC=$(git tag -l --format='%(contents)' $CI_COMMIT_TAG 2>/dev/null || echo 'Release $CI_COMMIT_TAG')"
    - "if [ -z \"$RELEASE_DESC\" ]; then RELEASE_DESC=\"Release $CI_COMMIT_TAG\"; fi"
    - "echo \"Creating release: $CI_COMMIT_TAG\""
    - "echo \"Description: $RELEASE_DESC\""
    - |
      curl -sS --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --form "tag_name=$CI_COMMIT_TAG" \
        --form "name=$CI_COMMIT_TAG" \
        --form "description=$RELEASE_DESC" \
        --form "assets[links][][name]=Linux amd64 Binary" \
        --form "assets[links][][url]=${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/release/portdesk" \
        --form "assets[links][][name]=Linux amd64 DEB" \
        --form "assets[links][][name]=Windows amd64" \
        --form "assets[links][][url]=${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/release/portdesk.exe" \
        "${API_URL}/releases"
    - "echo \"Release $CI_COMMIT_TAG created successfully.\""
  artifacts:
    paths:
      - release/
    expire_in: 90 days
