stages:
  - build
  - package

variables:
  GO_VERSION: "1.23"

.wails_base:
  image: golang:${GO_VERSION}-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.0-dev curl ca-certificates gnupg
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - cd frontend && npm install && cd ..
    - go install github.com/wailsapp/wails/v2/cmd/wails@latest
    - export PATH="$PATH:$HOME/go/bin"
  rules:
    - if: '$CI_COMMIT_TAG'

build-linux-amd64:
  extends: .wails_base
  stage: build
  script:
    - wails build -platform linux/amd64
  artifacts:
    paths:
      - build/bin/portdesk
      - build/bin/portdesk.deb
    expire_in: 30 days

build-windows-amd64:
  extends: .wails_base
  stage: build
  script:
    - apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
    - wails build -platform windows/amd64
  artifacts:
    paths:
      - build/bin/portdesk.exe
    expire_in: 30 days

package-release:
  stage: package
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - mkdir -p release
    - cp -r build/bin/* release/ 2>/dev/null || true
    - echo "=== Release $CI_COMMIT_TAG Artifacts ==="
    - ls -lh release/
  artifacts:
    paths:
      - release/
    expire_in: 90 days
